<html>
<head>
 <title>form</title>
</head>
<body bgcolor="lightblue">
<h1 align="center">Student Registration form</h1><br>
 <center>
 <form>
 <table>
<tr>
 <td>Name</td>
 <td><input type="text" name="Name"></td>
</tr>
<tr>
 <td>Gender</td>
 <td>
  <input type="radio" name="gender" value="male">Male
  <input type="radio" name="gender" value="female">Female
 </td>
 </tr>
 <tr>
  <td>Languages</td>
  <td>
      <input type="checkbox" name="hindi" value="hindi">hindi
      <input type="checkbox" name="english" value="english">english
      <input type="checkbox" name="telugu" value="telugu">telugu
   </td>
  </tr>
 <tr>

 <td>Email</td>
 <td><input type="email" name="email"></td>
 </tr>
 <tr>
 <tr>
  <td>Contact Number</td>
  <td><input type="number"><br></td>
 </tr>
 <tr>
  <td>Address</td>
  <td>
 <textarea name="Address" rows="4" cols="30" wrap></textarea></td>
 </tr>
<tr>
 <td>Job Location</td>
  <td>
       <select>
              <option>Hyderabad</option>
              <option>Mumbai</option>
              <option>Pune</option>
 </select>
 </td>
</tr>
<tr>

 <td>Upload File</td>
 <td><input type="file" name="Upload CV"></td>
</tr>
<tr>
 <td></td>
<td>
 
 <input type="submit">
 <input type="reset">
 </td>
</tr>
</table>
</form>

</body>
</html>
